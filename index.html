<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Optimizer API Client</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; padding: 40px; display: flex; justify-content: center; }
        .container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        input[type="file"], input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; text-align: center; }
        img { max-width: 100%; border-radius: 5px; margin-top: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .loading { text-align: center; color: #007bff; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Image Processing & Optimization</h2>
    <form id="uploadForm">
        <div class="form-group">
            <label for="imageInput">Choose an image:</label>
            <input type="file" id="imageInput" accept="image/*" required>
        </div>
        
        <div class="form-group">
            <label for="widthInput">New Width (pixels - optional):</label>
            <input type="number" id="widthInput" placeholder="e.g., 800">
        </div>

        <div class="form-group">
            <label for="heightInput">New Height (pixels - optional):</label>
            <input type="number" id="heightInput" placeholder="e.g., 600">
        </div>

        <div class="form-group">
            <label for="formatInput">Target Format:</label>
            <select id="formatInput">
                <option value="webp">WebP (Recommended)</option>
                <option value="jpeg">JPEG</option>
                <option value="png">PNG</option>
            </select>
        </div>

        <div class="form-group">
            <label for="qualityInput">Quality (1 - 100):</label>
            <input type="number" id="qualityInput" value="80" min="1" max="100">
        </div>

        <button type="submit">Process & Optimize Image</button>
    </form>

    <div class="loading" id="loadingText">Processing...</div>
    <div id="result"></div>
</div>

<script>
    const form = document.getElementById('uploadForm');
    const loadingText = document.getElementById('loadingText');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const fileInput = document.getElementById('imageInput');
        const widthInput = document.getElementById('widthInput').value;
        const heightInput = document.getElementById('heightInput').value;
        const formatInput = document.getElementById('formatInput').value;
        const qualityInput = document.getElementById('qualityInput').value;

        if (fileInput.files.length === 0) return;

        const formData = new FormData();
        formData.append('image', fileInput.files[0]);

        let url = 'http://localhost:3000/api/optimize?';
        const params = new URLSearchParams();
        if (widthInput) params.append('width', widthInput);
        if (heightInput) params.append('height', heightInput);
        if (formatInput) params.append('format', formatInput);
        if (qualityInput) params.append('quality', qualityInput);
        url += params.toString();

        loadingText.style.display = 'block';
        resultDiv.innerHTML = '';

        try {
            const response = await fetch(url, { method: 'POST', body: formData });
            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || 'Something went wrong');
            }

            const blob = await response.blob();
            const imageUrl = URL.createObjectURL(blob);

            resultDiv.innerHTML = `
                <h3>Output Image (${formatInput.toUpperCase()}):</h3>
                <img src="${imageUrl}" alt="Processed Image">
                <br><br>
                <a href="${imageUrl}" download="optimized-image.${formatInput}">
                    <button style="background-color: #28a745;">Download Image</button>
                </a>
            `;
        } catch (error) {
            resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        } finally {
            loadingText.style.display = 'none';
        }
    });
</script>

</body>
</html>
